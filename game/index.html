<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERVAULT — catch the fire, spend it back</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ffb347'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff4e2'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0617; }
  body { display: grid; place-items: center; font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
  #game { display: block; box-shadow: 0 0 120px rgba(255, 179, 71, 0.16), 0 0 40px rgba(139, 92, 246, 0.24); border-radius: 6px; }
  /* Read aloud by screen readers, never painted on the canvas. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="EMBERVAULT: hold to open a vault that catches enemy fire into a ring of amber shards, release to fire them back as a homing volley"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
